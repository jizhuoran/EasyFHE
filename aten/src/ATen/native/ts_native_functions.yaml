backend: Lazy
cpp_namespace: torch::lazy
full_codegen:
  - abs
  - add.Tensor
  - addcdiv
  - addcmul
  - arange.start_out
  - bernoulli
  - bernoulli.p
  - cat
  - clamp
  - clamp_min
  - div.Tensor
  - div.Tensor_mode
  - exp
  - flip
  - gather
  - index_select
  - log
  - log2
  - masked_fill.Scalar
  - masked_fill.Tensor
  - mul.Tensor
  - neg
  - reciprocal
  - repeat
  - rsqrt
  - scatter_add
  - sgn
  - sqrt
  - stack
  - sub.Tensor
  - alias_copy
  - as_strided_copy
  - diagonal_copy
  - expand_copy
  - permute_copy
  - _reshape_alias_copy
  - select_copy.int
  - slice_copy.Tensor
  # Not implemented yet because LTC codegen doesn't currently work
  # for ops that return lists of tensors.
  #- split_copy.Tensor
  #- split_with_sizes_copy
  #- unbind_copy.int
  - squeeze_copy
  - squeeze_copy.dim
  - squeeze_copy.dims
  - t_copy
  - transpose_copy.int
  - unsqueeze_copy
  - view_copy
  - view_copy.dtype
  - select_scatter
  - slice_scatter
  - diagonal_scatter
  - as_strided_scatter
  # random ops
  - normal_functional
ir_gen: []
supported:
  - clone
  - _copy_from
  - _copy_from_and_resize
  - empty.memory_format
  - empty_strided
  - fill_.Scalar
  - _to_copy
  - _unsafe_view
  - lift
  - lift_fresh
  # Below are all operators that are "composite" in core,
  # but require us to explicitly re-enable functionalization in order to use them.
  # Why? These operators are all CompositeExplicitAutograd, which mean that they run
  # after functionalization,
  # but their implementations call view operators (which we need to functionalize away).
  - diagonal_backward
  - slice_backward
  - new_empty_strided
  - narrow_copy
  - select_backward
symint:
  - empty.memory_format
  - expand_copy
  - narrow_copy
  - view_copy
  - as_strided_copy
  - as_strided_scatter
  - diagonal_backward
  - slice_backward
  - slice_copy.Tensor
  - slice_scatter
  - empty_strided
  - new_empty_strided
  - _reshape_alias_copy
  - select_backward
autograd: []

# Ops that don't have a native schema definitions and are dispatched within Lazy Tensor Core
non_native:
  - func: scalar(Scalar value, ScalarType type) -> Tensor
    opkind: at::prim::Constant
    properties:
      - ShapeCompute
      - TreatScalarsAsConstants
      - CanBeReusedDeclOnly
  # Even we have removed all the other view ops in favor of the *_copy version, expand
  # is still kept because it's used in copy_.
  - func: expand(Tensor input, int[] size, bool is_scalar_expand) -> Tensor
  - func: cast(Tensor input, ScalarType dtype, ScalarType? stype) -> Tensor
    opkind: ltc_cast
    properties:
      - ShapeCompute
